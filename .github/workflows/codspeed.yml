name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # Allow running the benchmarks manually, e.g. to refresh the baseline.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for the OIDC token CodSpeed uses to authenticate the run.
      id-token: write

    env:
      MIX_ENV: prod

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.19"
          otp-version: "28"

      - name: Restore dependency and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          # config is part of the key because codepagex bakes :encodings in at
          # compile time; a stale build cache would otherwise mismatch the config.
          key: ${{ runner.os }}-mix-bench-${{ hashFiles('config/**') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-bench-${{ hashFiles('config/**') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
